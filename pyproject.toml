[project]
name = "financial-research-agent"
version = "0.1.0"
description = "CLI research agent answering questions about Apple's FY2025 10-K and live web data, with citations."
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-m 'not integration'"
asyncio_mode = "auto"
markers = ["integration: needs real API keys and costs tokens; run with -m integration"]

[tool.ruff]
line-length = 120
target-version = "py312"
# Code samples in the design docs are illustrative, not formatted source.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "SIM", "RUF"]
# Filing text uses typographic punctuation (’ – “ ” ›) that code and tests must match exactly.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# HTML table fragments mirror EDGAR markup row by row.
"tests/unit/test_tables.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["research_agent", "filing_support"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src"]
ignore_missing_imports = true
